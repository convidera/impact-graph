bootstrap:
  description: Download Go modules and build everything with cgo (~30 s cold, a few seconds warm)
  host:
    - .devops/agents/bootstrap.sh

build:
  description: go build ./... (cgo); args replace the package list, e.g. build -o /tmp/impact ./cmd/impact
  host:
    - if [ $# -eq 0 ]; then set -- ./...; fi; go build "$@"

test:
  description: go test ./... -cover (~10 s); args replace the package list, e.g. test ./internal/graph -run TestName
  host:
    - if [ $# -eq 0 ]; then set -- ./...; fi; go test "$@" -cover

lint:
  description: go vet, gofmt check and golangci-lint v2.14.0, as in CI (~15 s)
  host:
    - go vet ./...
    - 'unformatted="$(gofmt -l .)"; if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:" >&2; echo "$unformatted" >&2; exit 1; fi'
    - 'want=v2.14.0; got="$(golangci-lint version --short 2>/dev/null || true)"; case "v${got#v}" in "$want") ;; *) echo "golangci-lint $want expected (the version pinned in .github/workflows/ci.yml), found: ${got:-none}" >&2; exit 1 ;; esac'
    - golangci-lint run "$@"

fmt:
  description: gofmt -w . (rewrites files)
  host:
    - gofmt -w .

impact:
  description: Build and run the impact CLI from source, e.g. impact index --root . -q; impact stats --root .
  host:
    - go run ./cmd/impact "$@"
